# FieldMesh FM-Z203 product machine alias.
#
# The inherited board support still uses the existing Z203 machine overrides so
# kernel, U-Boot, and device-tree recipes remain compatible while BitBake's
# product-facing MACHINE value is concise.

require conf/machine/sdr-z203-zynq7.conf

MACHINEOVERRIDES =. "fm-z203:sdr-z203-zynq7:"
FIELD_MESH_PRODUCT_MACHINE = "FM-Z203"
