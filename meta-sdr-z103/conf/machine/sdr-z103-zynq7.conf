# SDR-Z103: Zynq-7010 + AD9363 + 1R1T, currently QSPI booted.

require conf/machine/include/arm/armv7a/tune-cortexa9.inc

MACHINEOVERRIDES =. "zynq:zynq7:sdr-z103:"

DEFAULTTUNE ?= "cortexa9thf-neon"

MACHINE_FEATURES = "apm ext2 serial usbhost usbgadget vfat"

SERIAL_CONSOLES = "115200;ttyPS0"

KERNEL_IMAGETYPE = "zImage"
KERNEL_DEVICETREE = "zynq-pluto-sdr.dtb"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-sdr-z103"
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-sdr-z103"

UBOOT_MACHINE = "zynq_pluto_defconfig"
UBOOT_ENTRYPOINT = "0x8000"
UBOOT_LOADADDRESS = "0x8000"

IMAGE_FSTYPES ?= "cpio.gz tar.gz"

# Local vendor source root. Override this in build/conf/local.conf if needed.
SDR_Z103_VENDOR_FW ?= "${TOPDIR}/../../../src/extracted/sdr-z103-plutosdr-fw/plutosdr-fw"
